# Sveltia CMS configuration.
# Push Pop fills in `repo` with the GitHub repo it creates for the site.
backend:
  name: github
  repo: __REPO__
  branch: main

# Allow editing against the local working copy during `npm run dev`
# (run `npx @sveltia/cms-proxy-server` alongside the dev server).
local_backend: true

media_folder: "src/uploads"
public_folder: "/uploads"

# NOTE: `collections:` must remain the FINAL top-level key in this file.
# scaffold.js merges each template's extra collections by appending them here.
collections:
  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Site Settings
        file: "src/_data/site.json"
        fields:
          - { label: Site name, name: name, widget: string }
          - label: Theme
            name: theme
            widget: select
            options: [paper, signal, carbon, dune]
          - { label: Template, name: template, widget: hidden }
          - label: Extra navigation links
            name: extraLinks
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - { label: Footer text, name: footerText, widget: string, required: false }
          - label: Customize Design
            name: design
            widget: object
            collapsed: true
            fields:
              - { label: Background color, name: colorBg, widget: color, required: false }
              - { label: Surface color, name: colorSurface, widget: color, required: false }
              - { label: Text color, name: colorText, widget: color, required: false }
              - { label: Muted text color, name: colorMuted, widget: color, required: false }
              - { label: Accent color, name: colorAccent, widget: color, required: false }
              - { label: Text on accent color, name: colorAccentContrast, widget: color, required: false }
              - label: Display font
                name: fontDisplay
                widget: select
                required: false
                options:
                  - { label: Inter, value: inter }
                  - { label: Lora, value: lora }
                  - { label: Space Grotesk, value: space-grotesk }
                  - { label: Source Serif 4, value: source-serif-4 }
                  - { label: Source Sans 3, value: source-sans-3 }
                  - { label: Playfair Display, value: playfair-display }
                  - { label: DM Sans, value: dm-sans }
                  - { label: Bodoni Moda, value: bodoni-moda }
                  - { label: IBM Plex Sans, value: ibm-plex-sans }
                  - { label: IBM Plex Serif, value: ibm-plex-serif }
                  - { label: Work Sans, value: work-sans }
                  - { label: Libre Baskerville, value: libre-baskerville }
                  - { label: Outfit, value: outfit }
                  - { label: Crimson Pro, value: crimson-pro }
                  - { label: Fraunces, value: fraunces }
              - label: Body font
                name: fontBody
                widget: select
                required: false
                options:
                  - { label: Inter, value: inter }
                  - { label: Lora, value: lora }
                  - { label: Space Grotesk, value: space-grotesk }
                  - { label: Source Serif 4, value: source-serif-4 }
                  - { label: Source Sans 3, value: source-sans-3 }
                  - { label: Playfair Display, value: playfair-display }
                  - { label: DM Sans, value: dm-sans }
                  - { label: Bodoni Moda, value: bodoni-moda }
                  - { label: IBM Plex Sans, value: ibm-plex-sans }
                  - { label: IBM Plex Serif, value: ibm-plex-serif }
                  - { label: Work Sans, value: work-sans }
                  - { label: Libre Baskerville, value: libre-baskerville }
                  - { label: Outfit, value: outfit }
                  - { label: Crimson Pro, value: crimson-pro }
                  - { label: Fraunces, value: fraunces }
              - { label: "Corner radius (px)", name: radius, widget: number, value_type: float, min: 0, max: 32, required: false }
              - { label: "Spacing unit (rem)", name: spaceUnit, widget: number, value_type: float, min: 0.5, max: 2, required: false }
              - { label: "Content width (rem)", name: contentWidth, widget: number, value_type: float, min: 30, max: 80, required: false }

  - name: pages
    label: Pages
    folder: "src/pages"
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Show in navigation, name: nav_show, widget: boolean, default: true }
      - { label: Nav order, name: nav_order, widget: number, default: 10 }
      - { label: Layout, name: layout, widget: hidden, default: "layouts/page.njk" }
      - label: Blocks
        name: blocks
        widget: list
        types:
          - name: heading
            label: Heading
            fields:
              - { label: Text, name: text, widget: string }
              - { label: Level, name: level, widget: select, options: ["2", "3"], default: "2" }
          - name: text
            label: Text
            fields:
              - { label: Body, name: body, widget: markdown }
          - name: image
            label: Image
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Alt text, name: alt, widget: string }
              - { label: Caption, name: caption, widget: string, required: false }
          - name: gallery
            label: Image Gallery
            fields:
              - { label: Columns, name: columns, widget: select, options: ["2", "3", "4"], default: "3" }
              - label: Images
                name: images
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alt text, name: alt, widget: string }
          - name: faq
            label: FAQ
            fields:
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Question, name: question, widget: string }
                  - { label: Answer, name: answer, widget: markdown }
          - name: cta
            label: Call to Action
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: text, widget: string, required: false }
              - { label: Button label, name: label, widget: string }
              - { label: Button URL, name: url, widget: string }
